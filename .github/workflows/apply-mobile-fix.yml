name: Apply mobile basic shift fix
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link mobile fix stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<link rel="stylesheet" href="mobile-basicshift-fix.css?v=1">'
          if tag not in s:
              s=s.replace('</head>',tag+'</head>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load mobile basic shift layout fix'
          git push
