name: Apply mobile basic shift fix
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add weekday copy feature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          marker='basicshift-weekday-copy-v24'
          block=r'''<style id="basicshift-weekday-copy-v24-style">.v24-copy{margin:8px 0 2px;width:100%;height:40px;border:1px dashed #9ab7df;border-radius:9px;background:#f5f9ff;color:#1769c2;font-weight:800}.v24-panel{display:none;margin:8px 0 12px;padding:12px;border:1px solid #dbe5f0;border-radius:10px;background:#fff}.v24-panel.on{display:block}.v24-targets{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}.v24-targets label{display:flex;align-items:center;gap:4px;padding:7px 9px;border:1px solid #d9e0e8;border-radius:8px;background:#fafafa}.v24-targets input{width:18px!important;height:18px!important}.v24-apply{width:100%;height:40px;border:0;border-radius:9px;background:#0d6efd;color:#fff;font-weight:800}</style><script id="basicshift-weekday-copy-v24">(()=>{const names=['日','月','火','水','木','金','土'];function clone(x){return JSON.parse(JSON.stringify(x))}function getEmp(){const sel=document.getElementById('baseEmp');return window.db&&sel?db.employees.find(e=>String(e.id)===String(sel.value)):null}function dayData(e,d){if(e.basicShiftBlocks&&e.basicShiftBlocks[d])return clone(e.basicShiftBlocks[d]);const b=e.baseShift&&e.baseShift[d];if(!b)return {off:true,works:[]};const breaks=[];if(b.b1s||b.b1e)breaks.push({start:b.b1s||'',end:b.b1e||''});if(b.b2s||b.b2e)breaks.push({start:b.b2s||'',end:b.b2e||''});return {off:!b.on,works:b.on?[{start:b.start||'',end:b.end||'',breaks}]:[]}}function syncLegacy(e,d,x){e.baseShift=e.baseShift||{};const w=x.works&&x.works[0]||{start:'',end:'',breaks:[]},b=w.breaks||[];e.baseShift[d]={on:!x.off,start:w.start||'',end:w.end||'',b1s:b[0]?.start||'',b1e:b[0]?.end||'',b2s:b[1]?.start||'',b2e:b[1]?.end||''}}function add(){const grid=document.getElementById('baseShiftGrid');if(!grid)return;const days=[...grid.querySelectorAll('.v18-day')];days.forEach((el,i)=>{if(el.querySelector('.v24-copy'))return;const btn=document.createElement('button');btn.type='button';btn.className='v24-copy';btn.textContent='この曜日をコピー';const panel=document.createElement('div');panel.className='v24-panel';panel.innerHTML='<b>'+names[i]+'曜日の設定をコピー</b><div class="v24-targets">'+names.map((n,j)=>j===i?'':'<label><input type="checkbox" value="'+j+'">'+n+'</label>').join('')+'</div><button type="button" class="v24-apply">選択した曜日へコピー</button>';btn.onclick=()=>panel.classList.toggle('on');panel.querySelector('.v24-apply').onclick=()=>{const e=getEmp();if(!e)return;const targets=[...panel.querySelectorAll('input:checked')].map(x=>+x.value);if(!targets.length){alert('コピー先の曜日を選択してください');return}const src=dayData(e,i);e.basicShiftBlocks=e.basicShiftBlocks||{};targets.forEach(d=>{e.basicShiftBlocks[d]=clone(src);syncLegacy(e,d,src)});localStorage.setItem('shiftPayrollMockV2',JSON.stringify(db));if(typeof window.renderBaseShift==='function')window.renderBaseShift();setTimeout(add,50)};el.append(btn,panel)})}const old=window.renderBaseShift;if(typeof old==='function')window.renderBaseShift=function(){const r=old.apply(this,arguments);setTimeout(add,0);return r};document.addEventListener('click',e=>{if(e.target&&e.target.closest&&e.target.closest('[data-page="basicshift"],#goBaseShift'))setTimeout(add,100)});setTimeout(add,500)})();</script>'''
          a=s.find('<style id="basicshift-weekday-copy-v24-style">')
          if a>=0:
              b=s.find('</script>',a)+9; s=s[:a]+block+s[b:]
          else:s=s.replace('</body>',block+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add basic shift weekday copy'
          git push
