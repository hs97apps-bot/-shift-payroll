name: Apply mobile basic shift fix
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix weekday copy feature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          start=s.find('<style id="basicshift-weekday-copy-v24-style">')
          if start>=0:
            end=s.find('</script>',start)+9
            s=s[:start]+s[end:]
          block=r'''<style id="basicshift-weekday-copy-v25-style">.v25-copy{display:block!important;margin:10px 0 2px!important;width:100%!important;height:42px!important;border:1px dashed #7ea9dc!important;border-radius:9px!important;background:#f3f8ff!important;color:#1264b7!important;font-weight:800!important}.v25-panel{display:none;margin:8px 0 12px;padding:12px;border:1px solid #dbe5f0;border-radius:10px;background:#fff}.v25-panel.on{display:block!important}.v25-targets{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.v25-targets label{display:flex;align-items:center;gap:5px;padding:8px 10px;border:1px solid #d9e0e8;border-radius:8px;background:#fafafa}.v25-targets input{width:18px!important;height:18px!important}.v25-apply{width:100%;height:42px;border:0;border-radius:9px;background:#0d6efd;color:#fff;font-weight:800}</style><script id="basicshift-weekday-copy-v25">(()=>{const N=['日','月','火','水','木','金','土'];const cp=x=>JSON.parse(JSON.stringify(x));function install(){const g=document.getElementById('baseShiftGrid');if(!g)return;[...g.querySelectorAll('.v18-day')].forEach((day,i)=>{if(day.querySelector('.v25-copy'))return;const b=document.createElement('button');b.type='button';b.className='v25-copy';b.dataset.copyday=i;b.textContent='この曜日をコピー';const p=document.createElement('div');p.className='v25-panel';p.dataset.copypanel=i;p.innerHTML='<b>'+N[i]+'曜日の設定をコピー</b><div class="v25-targets">'+N.map((n,j)=>j===i?'':'<label><input type="checkbox" value="'+j+'">'+n+'曜</label>').join('')+'</div><button type="button" class="v25-apply" data-applyday="'+i+'">選択した曜日へコピー</button>';day.appendChild(b);day.appendChild(p)})}function currentDraft(){return typeof v20draft!=='undefined'?v20draft:null}document.addEventListener('click',e=>{const copy=e.target.closest('.v25-copy');if(copy){e.preventDefault();e.stopPropagation();const p=copy.nextElementSibling;if(p)p.classList.toggle('on');return}const apply=e.target.closest('.v25-apply');if(!apply)return;e.preventDefault();e.stopPropagation();const src=+apply.dataset.applyday,p=apply.closest('.v25-panel'),targets=[...p.querySelectorAll('input:checked')].map(x=>+x.value);if(!targets.length){alert('コピー先の曜日を選択してください');return}const draft=currentDraft();if(!draft||!draft[src]){alert('基本シフトを読み込み直してください');return}const data=cp(draft[src]);targets.forEach(d=>draft[d]=cp(data));if(typeof draw20==='function')draw20();setTimeout(install,0)},true);new MutationObserver(()=>install()).observe(document.documentElement,{childList:true,subtree:true});setTimeout(install,200)})();</script>'''
          old=s.find('<style id="basicshift-weekday-copy-v25-style">')
          if old>=0:
            end=s.find('</script>',old)+9; s=s[:old]+s[end:]
          s=s.replace('</body>',block+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix basic shift weekday copy interaction'
          git push
