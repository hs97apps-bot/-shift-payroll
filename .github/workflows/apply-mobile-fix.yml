name: Apply mobile basic shift fix
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add night premium calculation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          block=r'''<style id="night-premium-v26-style">.v26-night{font-size:12px;color:#5f6b7a;margin-top:5px}.v26-night b{color:#1d4f91}</style><script id="night-premium-v26">(()=>{function m(t){if(!t)return null;const a=t.split(':').map(Number);return a[0]*60+a[1]}function overlap(a,b,c,d){return Math.max(0,Math.min(b,d)-Math.max(a,c))}function nightMinutes(start,end,breaks=[]){let a=m(start),b=m(end);if(a==null||b==null)return 0;if(b<=a)b+=1440;let n=overlap(a,b,1320,1740)+overlap(a,b,-120,300);for(const br of breaks){let x=m(br.start),y=m(br.end);if(x==null||y==null)continue;if(y<=x)y+=1440;if(x<a&&a>=1320)x+=1440;if(y<a&&a>=1320)y+=1440;n-=overlap(x,y,1320,1740)+overlap(x,y,-120,300)}return Math.max(0,n)}function calcRow(r){const empId=r.empId||r.employeeId||r.emp;const e=(typeof db!=='undefined'&&db.employees||[]).find(x=>String(x.id)===String(empId));if(!e)return {min:0,premium:0};const bs=r.breaks||[];const min=nightMinutes(r.start||r.startTime,r.end||r.endTime,bs);const wage=Number(e.wage||e.hourlyWage||e.hourly||0);return {min,premium:Math.round(wage*.25*min/60)}}window.nightPremiumCalc={nightMinutes,calcRow};const oldSave=window.saveDB;function enhance(){if(typeof db==='undefined'||!db.days)return;Object.values(db.days).forEach(v=>{const rows=Array.isArray(v)?v:(v&&v.rows)||[];rows.forEach(r=>{const z=calcRow(r);r.nightMinutes=z.min;r.nightPremium=z.premium})})}document.addEventListener('change',e=>{if(e.target&&e.target.matches('input[type="time"]'))setTimeout(enhance,0)},true);document.addEventListener('click',e=>{if(e.target&&/保存|登録|更新/.test(e.target.textContent||''))setTimeout(()=>{enhance();try{localStorage.setItem('shiftPayrollMockV2',JSON.stringify(db))}catch(_){}},50)},true);enhance()})();</script>'''
          a=s.find('<style id="night-premium-v26-style">')
          if a>=0:
            b=s.find('</script>',a)+9; s=s[:a]+block+s[b:]
          else:
            s=s.replace('</body>',block+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add automatic night premium calculation'
          git push
