name: Apply mobile basic shift fix
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final iPhone override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); marker='final-iphone-basicshift-v23'
          css='''<style id="final-iphone-basicshift-v23">@media(max-width:700px){#baseShiftGrid .v18-work{width:100%!important;max-width:100%!important;padding:12px!important;overflow:hidden!important}#baseShiftGrid .v18-row{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;width:100%!important;margin:0 0 12px!important}#baseShiftGrid .v18-break{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr)) 28px!important;gap:8px!important;width:100%!important;align-items:end!important;margin:0 0 10px!important}#baseShiftGrid .v18-field{display:flex!important;flex-direction:column!important;width:100%!important;min-width:0!important;max-width:100%!important;gap:5px!important}#baseShiftGrid .v18-field label{display:block!important;width:100%!important;height:20px!important;line-height:20px!important;margin:0!important;padding:0!important;font-size:13px!important;font-weight:700!important}#baseShiftGrid .v18-field input[type=time]{-webkit-appearance:none!important;appearance:none!important;display:block!important;width:100%!important;min-width:0!important;max-width:100%!important;height:48px!important;line-height:48px!important;margin:0!important;padding:0 6px!important;border:1px solid #d9dee7!important;border-radius:10px!important;box-sizing:border-box!important;background:#f1f1f1!important;font-size:17px!important;font-variant-numeric:tabular-nums!important;text-align:center!important;text-align-last:center!important}#baseShiftGrid input[type=time]::-webkit-date-and-time-value{text-align:center!important;margin:0!important;padding:0!important;min-height:0!important}#baseShiftGrid input[type=time]::-webkit-datetime-edit{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;padding:0!important}#baseShiftGrid input[type=time]::-webkit-datetime-edit-fields-wrapper{padding:0!important}#baseShiftGrid .v18-break .sep{display:none!important}#baseShiftGrid .v18-break .v18-field{grid-column:auto!important;grid-row:auto!important}#baseShiftGrid .v18-break .v18-delete{grid-column:3!important;grid-row:1!important;align-self:end!important;width:28px!important;min-width:28px!important;max-width:28px!important;height:48px!important;margin:0!important;padding:0!important;border:0!important;background:transparent!important}#baseShiftGrid .v18-mini{display:block!important;width:100%!important;max-width:100%!important;margin-top:4px!important;padding:10px!important;text-align:center!important}#baseShiftGrid .v18-addwork{width:100%!important;max-width:100%!important}}</style>'''
          a=s.find('<style id="'+marker+'">')
          if a>=0:
              b=s.find('</style>',a)+8; s=s[:a]+css+s[b:]
          else: s=s.replace('</body>',css+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Align iPhone shift time fields and borders'
          git push
