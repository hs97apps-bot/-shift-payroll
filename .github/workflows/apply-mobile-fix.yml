name: Apply night premium UI
on:
  push:
    paths:
      - '.github/workflows/apply-mobile-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add night premium display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          tag='<script id="night-premium-display-v28">'
          js=r'''<script id="night-premium-display-v28">
(function(){
 function mm(t){if(!t)return null;var a=t.split(':');return (+a[0])*60+(+a[1])}
 function ov(a,b,c,d){return Math.max(0,Math.min(b,d)-Math.max(a,c))}
 function nm(r){var a=mm(r.start),b=mm(r.end);if(a==null||b==null)return 0;if(b<=a)b+=1440;var n=ov(a,b,1320,1740)+ov(a,b,-120,300);[[r.b1s,r.b1e],[r.b2s,r.b2e]].forEach(function(q){var x=mm(q[0]),y=mm(q[1]);if(x==null||y==null)return;if(y<=x)y+=1440;if(a>=1320&&x<a){x+=1440;y+=1440}n-=ov(x,y,1320,1740)+ov(x,y,-120,300)});return Math.max(0,n)}
 function np(r){return Math.round((+r.rate||0)*0.25*nm(r)/60)}
 function fh(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
 function run(){
  try{
   var hr=document.querySelector('#daily table thead tr');
   if(hr&&!hr.querySelector('.night28h')){var th=document.createElement('th');th.className='night28h';th.textContent='深夜時間 / 深夜割増';hr.insertBefore(th,hr.lastElementChild)}
   document.querySelectorAll('#dailyRows tr').forEach(function(tr,i){var rs=(db.days[workDate.value]||[]),r=rs[i];if(!r)return;var old=tr.querySelector('.night28');if(old)old.remove();var td=document.createElement('td');td.className='calc night28';td.innerHTML=fh(nm(r))+'<div class="muted">'+yen(np(r))+'</div>';tr.insertBefore(td,tr.lastElementChild)})
   var ph=document.querySelector('#payroll table thead tr');
   if(ph&&!ph.querySelector('.night28ph')){var pth=document.createElement('th');pth.className='night28ph';pth.textContent='深夜時間 / 深夜割増';ph.insertBefore(pth,ph.children[4])}
   var month=payMonth.value;
   document.querySelectorAll('#payRows tr').forEach(function(tr){var name=tr.children[0]&&tr.children[0].textContent,e=db.employees.find(function(x){return x.name===name});if(!e)return;var rows=[];Object.keys(db.days).forEach(function(d){if(d.indexOf(month)===0)(db.days[d]||[]).forEach(function(r){if(r.empId==e.id)rows.push(r)})});var mins=rows.reduce(function(a,r){return a+nm(r)},0),amt=rows.reduce(function(a,r){return a+np(r)},0);var old=tr.querySelector('.night28p');if(old)old.remove();var td=document.createElement('td');td.className='calc night28p';td.innerHTML=fh(mins)+'<div class="muted">'+yen(amt)+'</div>';tr.insertBefore(td,tr.children[4])})
  }catch(e){}
 }
 new MutationObserver(function(){run()}).observe(document.body,{childList:true,subtree:true});
 document.addEventListener('change',function(){setTimeout(run,20)},true);
 setTimeout(run,300);
})();
</script>'''
          a=s.find(tag)
          if a>=0:
            b=s.find("</script>",a)
            if b>=0:s=s[:a]+s[b+9:]
          s=s.replace("</body>",js+"</body>",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix visible night premium columns'
          git push
